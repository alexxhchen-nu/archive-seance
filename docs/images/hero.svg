<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Archive Séance</title>
  <desc id="d">A network of solid and ghost nodes drawn over an archive page, with the title Archive Séance and the tagline: turn public-archive PDFs into a source-linked network. On-device first.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1226"/>
      <stop offset="0.55" stop-color="#2a1a33"/>
      <stop offset="1" stop-color="#3b2418"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1010" cy="170" r="230" fill="url(#glow)"/>

  <!-- archive page -->
  <g transform="translate(790 48) rotate(-4)">
    <rect width="190" height="250" rx="6" fill="#f1e4c4" opacity="0.92"/>
    <g fill="#8a7650" opacity="0.7">
      <rect x="18" y="26" width="120" height="7" rx="3"/><rect x="18" y="46" width="150" height="5" rx="2"/>
      <rect x="18" y="60" width="140" height="5" rx="2"/><rect x="18" y="74" width="150" height="5" rx="2"/>
      <rect x="18" y="98" width="100" height="5" rx="2"/><rect x="18" y="112" width="150" height="5" rx="2"/>
      <rect x="18" y="126" width="132" height="5" rx="2"/><rect x="18" y="150" width="150" height="5" rx="2"/>
      <rect x="18" y="164" width="110" height="5" rx="2"/><rect x="18" y="188" width="150" height="5" rx="2"/>
      <rect x="18" y="202" width="124" height="5" rx="2"/>
    </g>
    <rect x="16" y="94" width="108" height="13" rx="3" fill="#ffb347" opacity="0.55"/>
  </g>

  <!-- network -->
  <g stroke="#c9b6ff" stroke-width="2" opacity="0.8" fill="none">
    <path d="M1010 120 L1130 90"/><path d="M1010 120 L1100 215"/><path d="M1010 120 L920 205"/>
    <path d="M1100 215 L1190 250"/><path d="M920 205 L1000 292"/>
    <path d="M1100 215 L1000 292" stroke-dasharray="6 6" opacity="0.7"/>
    <path d="M1130 90 L1215 150" stroke-dasharray="6 6" opacity="0.7"/>
  </g>
  <path d="M1010 120 L960 210" stroke="#ffb347" stroke-width="2.5" stroke-dasharray="2 5" fill="none"/>
  <g>
    <circle cx="1010" cy="120" r="26" fill="#7c5cff"/>
    <circle cx="1130" cy="90" r="18" fill="#33c3a4"/>
    <circle cx="1100" cy="215" r="22" fill="#7c5cff"/>
    <circle cx="920" cy="205" r="16" fill="#33c3a4"/>
    <circle cx="1190" cy="250" r="14" fill="#7c5cff"/>
    <!-- ghost nodes: translucent, dashed ring -->
    <circle cx="1000" cy="292" r="20" fill="#c9b6ff" opacity="0.28" filter="url(#soft)"/>
    <circle cx="1000" cy="292" r="20" fill="none" stroke="#e6dcff" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="1000" y="299" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#f4eeff">?</text>
    <circle cx="1215" cy="150" r="17" fill="#c9b6ff" opacity="0.28"/>
    <circle cx="1215" cy="150" r="17" fill="none" stroke="#e6dcff" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="1215" y="157" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#f4eeff">?</text>
  </g>

  <!-- title -->
  <text x="64" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#fff3d6">Archive Séance</text>
  <text x="66" y="176" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#ffd98a">档案通灵板</text>
  <text x="66" y="226" font-family="Georgia, serif" font-size="25" fill="#e9defa">Turn public-archive PDFs into a source-linked network.</text>
  <text x="66" y="262" font-family="Georgia, serif" font-size="25" fill="#e9defa">On-device first. Cloud only when you allow it.</text>
  <g font-family="Verdana, sans-serif" font-size="15" fill="#1b1226">
    <rect x="66" y="288" width="150" height="30" rx="15" fill="#ffd98a"/><text x="141" y="308" text-anchor="middle">Gemini Nano</text>
    <rect x="228" y="288" width="150" height="30" rx="15" fill="#c9b6ff"/><text x="303" y="308" text-anchor="middle">Cloud fallback</text>
    <rect x="390" y="288" width="150" height="30" rx="15" fill="#33c3a4"/><text x="465" y="308" text-anchor="middle">Ghost nodes</text>
  </g>
</svg>
